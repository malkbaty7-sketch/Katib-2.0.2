name: Build Signed Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_signed_apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      KEYSTORE_PATH: ${{ github.workspace }}/app/my-upload-key.jks
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: upload

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create keystore from GitHub secret
        shell: bash
        run: |
          mkdir -p "$(dirname "$KEYSTORE_PATH")"
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "KEYSTORE_BASE64 secret is missing" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Upload Signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: katib-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
